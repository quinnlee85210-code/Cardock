name: account_subscription_manager
description: "本地账号与订阅记录工具"
publish_to: 'none'
version: 1.0.3+87

environment:
  sdk: ^3.12.2

dependencies:
  archive: 3.6.1
  cryptography: 2.9.0
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 22.2.0
  flutter_secure_storage: 10.3.1
  flutter_timezone: 5.1.0
  intl: 0.20.2
  local_auth: 3.0.2
  path_provider: 2.1.6
  timezone: 0.11.1
  unorm_dart: 0.3.2
  url_launcher: 6.3.2
  xml: 6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/cardock_launcher_ceramic_blue.png
    - assets/branding/cardock_launcher_sakura_mist.png
    - assets/branding/cardock_launcher_paper_archive.png
    - assets/branding/cardock_launcher_lilac_moon.png
    - assets/branding/cardock_launcher_glacier_blue.png
    - assets/branding/cardock_launcher_mist_coral.png
    - assets/branding/cardock_launcher_neon_zero.png
    - assets/branding/cardock_launcher_obsidian_gold.png
    - assets/theme/paper_grain_128.webp
    - assets/brands/v1/
    - assets/brands/v1/icons/
    - assets/temporary_web/index.html
    - assets/temporary_web/app.css
    - assets/temporary_web/app.js
    - assets/licenses/
